<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sales Center</title>
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafaf8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { text-align: center; max-width: 420px; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
    p { margin-top: 12px; font-size: 15px; color: #555; line-height: 1.6; }
    a { color: #555; }
    footer { position: fixed; bottom: 20px; font-size: 12px; color: #999; }
    footer a { color: #999; text-decoration: none; margin: 0 6px; }
  </style>
</head>
<body>
  <main>
    <h1>SALES CENTER</h1>
    <p>Dubai, United Arab Emirates</p>
    <p><a href="mailto:hello@salescenter.ae">hello@salescenter.ae</a></p>
  </main>
  <footer>
    <span>&copy; 2026 Sales Center</span> &middot; <a href="/privacy">Privacy</a>
  </footer>
</body>
</html>
